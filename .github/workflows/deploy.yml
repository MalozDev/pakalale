name: Deploy to EC2

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /var/www/pakalale
            git pull origin main
            sudo docker rm -f pakalale
            sudo docker build -t pakalale .
            sudo docker run -d --name pakalale -p 80:3000 --env-file .env --restart unless-stopped pakalale
            echo "✅ Deployed successfully!"
